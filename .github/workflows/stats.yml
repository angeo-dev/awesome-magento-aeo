name: stats

on:
  push:
    branches: [main]
    paths: [README.md]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recount entries and rewrite the stats line
        run: |
          python3 - <<'PY'
          import re, sys

          PATH = 'README.md'
          STATS = re.compile(r'^\*\*\d+ projects tracked\*\*.*$')
          ANCHOR = 'Last reviewed:'
          SKIP = {'Contents', 'Reading', 'Related Lists', 'Contributing',
                  'License', 'How to Choose', 'At a Glance'}

          original = open(PATH, encoding='utf-8').read()
          lines = original.split('\n')

          section, items = None, {}
          for line in lines:
              if line.startswith('## '):
                  section = line[3:].strip()
                  items.setdefault(section, 0)
              elif line.startswith('- [') and section and section not in SKIP:
                  items[section] += 1

          total = sum(v for k, v in items.items() if k not in SKIP)
          stats = (f"**{total} projects tracked** — "
                   f"{items.get('Discovery Files', 0)} discovery file implementations, "
                   f"{items.get('MCP Servers', 0)} MCP servers, "
                   f"{items.get('Agentic Checkout', 0)} agentic checkout projects, "
                   f"{items.get('Specifications and Standards', 0)} specifications.")

          out, seen, i = [], False, 0
          while i < len(lines):
              line = lines[i]
              if STATS.match(line):
                  if not seen:
                      out.append(stats)
                      seen = True
                  else:
                      if i + 1 < len(lines) and lines[i + 1] == '':
                          i += 1
                  i += 1
                  continue
              out.append(line)
              i += 1

          if not seen:
              try:
                  anchor = next(n for n, l in enumerate(out) if l.startswith(ANCHOR))
              except StopIteration:
                  sys.exit(f'error: no stats line and no "{ANCHOR}" anchor in {PATH}')
              out[anchor:anchor] = [stats, '']

          count = sum(1 for l in out if STATS.match(l))
          if count != 1:
              sys.exit(f'error: expected exactly 1 stats line, found {count}')

          updated = '\n'.join(out)
          if updated != original:
              open(PATH, 'w', encoding='utf-8').write(updated)
              print('updated:', stats)
          else:
              print('unchanged:', stats)

          PY

      - name: Verify the rewrite is idempotent
        run: |
          cp README.md /tmp/README.first
          python3 - <<'PY'
          import re, sys

          PATH = 'README.md'
          STATS = re.compile(r'^\*\*\d+ projects tracked\*\*.*$')
          ANCHOR = 'Last reviewed:'
          SKIP = {'Contents', 'Reading', 'Related Lists', 'Contributing',
                  'License', 'How to Choose', 'At a Glance'}

          original = open(PATH, encoding='utf-8').read()
          lines = original.split('\n')

          section, items = None, {}
          for line in lines:
              if line.startswith('## '):
                  section = line[3:].strip()
                  items.setdefault(section, 0)
              elif line.startswith('- [') and section and section not in SKIP:
                  items[section] += 1

          total = sum(v for k, v in items.items() if k not in SKIP)
          stats = (f"**{total} projects tracked** — "
                   f"{items.get('Discovery Files', 0)} discovery file implementations, "
                   f"{items.get('MCP Servers', 0)} MCP servers, "
                   f"{items.get('Agentic Checkout', 0)} agentic checkout projects, "
                   f"{items.get('Specifications and Standards', 0)} specifications.")

          out, seen, i = [], False, 0
          while i < len(lines):
              line = lines[i]
              if STATS.match(line):
                  if not seen:
                      out.append(stats)
                      seen = True
                  else:
                      if i + 1 < len(lines) and lines[i + 1] == '':
                          i += 1
                  i += 1
                  continue
              out.append(line)
              i += 1

          if not seen:
              try:
                  anchor = next(n for n, l in enumerate(out) if l.startswith(ANCHOR))
              except StopIteration:
                  sys.exit(f'error: no stats line and no "{ANCHOR}" anchor in {PATH}')
              out[anchor:anchor] = [stats, '']

          count = sum(1 for l in out if STATS.match(l))
          if count != 1:
              sys.exit(f'error: expected exactly 1 stats line, found {count}')

          updated = '\n'.join(out)
          if updated != original:
              open(PATH, 'w', encoding='utf-8').write(updated)
              print('updated:', stats)
          else:
              print('unchanged:', stats)

          PY
          diff -u /tmp/README.first README.md \
            || (echo '::error::stats rewrite is not idempotent — a second run changed README.md' && exit 1)

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: recount entries'
          file_pattern: README.md
